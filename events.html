<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Events | Army’s Wears</title>
<meta name="description" content="Showroom previews, sale weekends and masterclasses at Army’s Wears.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/main.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><h1>Upcoming Events</h1><p>Join us at the showroom. Past events are removed automatically.</p></div></section>
<section class="section"><div class="wrap">
  <div class="countdown" id="countdown"><div><p class="eyebrow" style="color:var(--brass-dk)">Next event</p><h2 id="next-title"></h2></div>
    <div class="timer" role="timer" aria-label="Time until next event"><div><b id="cd-d">0</b><span>Days</span></div><div><b id="cd-h">00</b><span>Hours</span></div><div><b id="cd-m">00</b><span>Mins</span></div><div><b id="cd-s">00</b><span>Secs</span></div></div></div>
  <div data-events></div>
</div></section>
</main>
<div id="site-footer"></div>
</body>
</html>
